<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mikrotik Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M6 22 L12 12 L16 18 L20 9 L26 22' fill='none' stroke='%2338d0f0' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="frame" class="frame lvl-calm">
  <header class="top">
    <a class="brand" href="#/overview" aria-label="Overview">
      <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M5 23 L11 12 L16 19 L21 8 L27 23"/></svg>
      <span class="brand-name">Command Center</span>
    </a>
    <div class="router-id" id="router-id"><span class="muted">not connected</span></div>
    <div class="chips" id="chips"></div>
    <div class="top-right">
      <button class="level" id="level" title="Threat level -- open threats in the last 15 minutes">CALM</button>
      <button class="icon-btn" id="cmdk-btn" title="Search and jump (Ctrl+K)" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <button class="icon-btn" id="layout-btn" title="Reset this page's layout (panels are resizable: drag their right / bottom edges)" aria-label="Reset layout">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="7" rx="1.5"/></svg>
      </button>
      <button class="icon-btn" id="theme-btn" title="Light / dark" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <div class="clock" id="clock"></div>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#/overview" data-page="overview">Overview</a>
    <a href="#/traffic" data-page="traffic">Traffic</a>
    <a href="#/threats" data-page="threats">Threats <b class="badge" id="nb-threats"></b></a>
    <a href="#/actions" data-page="actions">Actions <b class="badge" id="nb-actions"></b></a>
    <a href="#/devices" data-page="devices">Devices</a>
    <a href="#/interfaces" data-page="interfaces">Interfaces</a>
    <a href="#/logs" data-page="logs">Logs</a>
    <a href="#/setup" data-page="setup">Setup <b class="badge warn" id="nb-setup"></b></a>
  </nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="drawer" class="drawer" aria-hidden="true"></div>
<div id="modal" class="modal-wrap" aria-hidden="true"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="cmdk" class="cmdk-wrap" aria-hidden="true"></div>
<div id="tip" class="tip" role="tooltip"></div>
<script src="/core.js"></script>
<script src="/charts.js"></script>
<script src="/map.js"></script>
<script src="/world.js"></script>
<script src="/globe.js"></script>
<script src="/views.js"></script>
<script src="/layout.js"></script>
</body>
</html>
